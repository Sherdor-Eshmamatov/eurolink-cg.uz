<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Suspended</title>
    <style>
        /* Umumiy sozlamalar (Reset & Typography) */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0a0a0a;
            color: #ededed;
            /* Apple va zamonaviy tizim shriftlari */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            /* Markazga joylashtirish (Flexbox) */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Matnni belgilaganda chiqadigan fon rangi */
        ::selection {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Asosiy konteyner */
        .container {
            max-width: 450px;
            width: 100%;
            padding: 0 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Kichik status teksti */
        .status-notice {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2em; /* Harflar orasidagi ochiq masofa */
            text-transform: uppercase;
            color: #737373;
            margin-bottom: 16px;
        }

        /* Asosiy sarlavha */
        .main-title {
            font-size: 30px;
            font-weight: 300; /* Ingichka shrift */
            letter-spacing: -0.025em;
            margin: 0 0 24px 0;
        }

        /* Minimalistik ajratuvchi chiziq */
        .divider {
            width: 40px;
            height: 1px;
            background-color: #262626;
            margin-bottom: 24px;
        }

        /* Qo'shimcha ma'lumot */
        .description {
            font-size: 14px;
            color: #a3a3a3;
            font-weight: 300;
            line-height: 1.6;
            margin: 0;
        }

        /* Telefonlar uchun moslashuvchanlik (Responsive) */
        @media (max-width: 600px) {
            .main-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="status-notice">Status Notice</span>
        <h1 class="main-title">Project Suspended</h1>
        <div class="divider"></div>
        <p class="description">
            This application has been temporarily paused. <br>
            Please contact the system administrator for further details.
        </p>
    </div>

</body>
</html>
